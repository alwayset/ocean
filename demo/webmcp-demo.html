<!DOCTYPE html>
<html>
<head>
    <title>WebMCP Demo — Tokyo Hotel Booking</title>
</head>
<body>
    <h1>Tokyo Sakura Hotel</h1>
    <p>A demo page that exposes WebMCP tools for AI agents to discover.</p>

    <script>
    // Simulate WebMCP tool registration (Chrome 146+ navigator.modelContext API)
    if (!navigator.modelContext) {
        navigator.modelContext = { registerTool: function(def) { console.log('WebMCP registered:', def.name); } };
    }

    navigator.modelContext.registerTool({
        name: "searchRooms",
        description: "Search available rooms at Tokyo Sakura Hotel by date range, room type, and guest count",
        inputSchema: {
            type: "object",
            properties: {
                checkIn: { type: "string", format: "date", description: "Check-in date (YYYY-MM-DD)" },
                checkOut: { type: "string", format: "date", description: "Check-out date (YYYY-MM-DD)" },
                roomType: { type: "string", enum: ["single", "double", "suite", "family"], description: "Room type" },
                guests: { type: "integer", minimum: 1, maximum: 4, description: "Number of guests" }
            },
            required: ["checkIn", "checkOut"]
        },
        handler: async (input) => {
            return { rooms: [{ id: "R101", type: input.roomType || "double", price: 15000, currency: "JPY" }] };
        }
    });

    navigator.modelContext.registerTool({
        name: "bookRoom",
        description: "Book a specific room at Tokyo Sakura Hotel",
        inputSchema: {
            type: "object",
            properties: {
                roomId: { type: "string", description: "Room ID from searchRooms result" },
                guestName: { type: "string", description: "Guest full name" },
                email: { type: "string", format: "email", description: "Guest email for confirmation" }
            },
            required: ["roomId", "guestName", "email"]
        },
        handler: async (input) => {
            return { bookingId: "BK-" + Date.now(), status: "confirmed" };
        }
    });

    navigator.modelContext.registerTool({
        name: "getLocalAttractions",
        description: "Get nearby attractions and restaurants within walking distance of Tokyo Sakura Hotel",
        inputSchema: {
            type: "object",
            properties: {
                category: { type: "string", enum: ["restaurants", "temples", "shopping", "parks"], description: "Category of attractions" },
                maxDistance: { type: "integer", description: "Maximum walking distance in meters", default: 500 }
            }
        },
        handler: async (input) => {
            return { attractions: [{ name: "Senso-ji Temple", distance: 300, category: "temples" }] };
        }
    });
    </script>
</body>
</html>
